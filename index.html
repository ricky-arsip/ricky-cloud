<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ricky Cloud - Arsip Dokumen</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 22px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    input, select, textarea, button {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      margin-top: 8px;
      margin-bottom: 14px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    .dokumen {
      border: 1px solid #ddd;
      padding: 15px;
      margin-top: 12px;
      border-radius: 8px;
    }

    .dokumen a {
      display: inline-block;
      margin-top: 8px;
      color: #2563eb;
      font-weight: bold;
      text-decoration: none;
    }

    #status {
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>☁️ Ricky Cloud</h1>
  <p>Penyimpanan Arsip Dokumen</p>
</header>

<div class="container">

  <div class="card">
    <h2>📤 Upload Dokumen</h2>

    <label>Nama Dokumen</label>
    <input id="nama" type="text" placeholder="Contoh: Surat Masuk 001">

    <label>Kategori</label>
    <select id="kategori">
      <option value="">Pilih kategori</option>
      <option>Surat Masuk</option>
      <option>Surat Keluar</option>
      <option>Surat Tugas</option>
      <option>Laporan</option>
      <option>Lainnya</option>
    </select>

    <label>Deskripsi</label>
    <textarea id="deskripsi" placeholder="Keterangan dokumen"></textarea>

    <label>Pilih File</label>
    <input id="file" type="file"
      accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">

    <button onclick="uploadDokumen()">⬆️ Upload Dokumen</button>

    <div id="status"></div>
  </div>

  <div class="card">
    <h2>📚 Daftar Arsip</h2>

    <input id="search"
      type="text"
      placeholder="🔎 Cari dokumen..."
      oninput="tampilkanDokumen()">

    <div id="daftar"></div>
  </div>

</div>

<script>

  // =========================
  // KONFIGURASI SUPABASE
  // =========================

  const SUPABASE_URL =
    "https://cmbouwymtdpdtdjrepqo.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_....";

  const supabaseClient =
    supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
